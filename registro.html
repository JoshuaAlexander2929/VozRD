<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - VozRD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="navbar">
        <div class="logo"><img src="{{ url_for('static', filename='logo.png') }}" alt="VozRD" class="logo-img"></div>
        <nav>
            <a href="{{ url_for('inicio') }}">Inicio</a>
        </nav>
    </header>

    <main>
        <section class="hero" style="padding:40px 50px; max-width:480px; margin:40px auto 0;">
            <div class="etiqueta">ÚNETE A LA COMUNIDAD</div>
            <h1 style="font-size:32px;">Crear <span>cuenta</span></h1>
        </section>

        <section class="feed" style="max-width:480px; margin:20px auto 0;">
            <div class="post">

                {% if error %}
                <p style="background:#fee2e2; color:#991b1b; padding:12px; border-radius:8px; margin-bottom:16px; font-weight:700;">
                    {{ error }}
                </p>
                {% endif %}

                <form method="POST" style="display:flex; flex-direction:column; gap:16px;">
                    <div>
                        <label>Nombre de usuario</label><br>
                        <input type="text" name="nombre_usuario" required
                            style="width:100%; padding:10px; margin-top:5px; border:2px solid #2B2620; border-radius:10px; font-family:'Nunito', sans-serif;">
                    </div>

                    <div>
                        <label>Correo electrónico</label><br>
                        <input type="email" name="email" required
                            style="width:100%; padding:10px; margin-top:5px; border:2px solid #2B2620; border-radius:10px; font-family:'Nunito', sans-serif;">
                    </div>

                    <div>
                        <label>Contraseña</label><br>
                        <input type="password" name="password" required minlength="6"
                            style="width:100%; padding:10px; margin-top:5px; border:2px solid #2B2620; border-radius:10px; font-family:'Nunito', sans-serif;">
                        <small style="color:#756B5B;">Mínimo 6 caracteres</small>
                    </div>

                    <button type="submit" class="btn-principal" style="margin-top:0;">
                        Crear cuenta
                    </button>
                </form>

                <p style="margin-top:18px; color:#756B5B;">
                    ¿Ya tienes cuenta?
                    <a href="{{ url_for('login') }}" style="color:#E15A4E; font-weight:800;">Inicia sesión</a>
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>VozRD — Periodismo ciudadano dominicano</p>
        <small>Cada ciudadano es un reportero</small>
    </footer>

</body>
</html>
